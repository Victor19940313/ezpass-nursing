<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-site-title="裝置管理 - {name}"></title>
    <script src="site-config.js?v=v"></script>
    <script src="site.js?v=v"></script>
    <link rel="icon" href="icons/icon-192.png" />
    <script src="version.js?v=v"></script>
    <script src="skin.js?v=v"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Noto Sans TC",
          -apple-system,
          sans-serif;
        background: #f8f7f0;
        color: #2d2a22;
        min-height: 100vh;
        padding: 1.5rem 1rem 3rem;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .back {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 0.5rem 1rem;
        text-decoration: none;
        color: #4b5563;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .back:hover {
        background: #f3f4f6;
      }
      h1 {
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 0.4rem;
      }
      .sub-title {
        text-align: center;
        color: #6b7280;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      .warn {
        background: #fef2f2;
        border: 1.5px solid #f87171;
        border-radius: 10px;
        padding: 1rem;
        color: #7f1d1d;
        margin-bottom: 1.2rem;
        font-size: 0.9rem;
      }
      .warn b {
        color: #b91c1c;
      }
      .hint {
        background: #eff6ff;
        border: 1px solid #93c5fd;
        border-radius: 10px;
        padding: 0.8rem 1rem;
        color: #1e40af;
        margin-bottom: 1.2rem;
        font-size: 0.85rem;
        line-height: 1.6;
      }
      .device-row {
        background: #fff;
        border: 1.5px solid #e5e7eb;
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 0.7rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .device-row.current {
        border-color: #22c55e;
        background: linear-gradient(135deg, #f0fdf4, #ffffff);
      }
      .device-row.inactive {
        opacity: 0.55;
        background: #fafafa;
      }
      .dev-icon {
        font-size: 1.6rem;
      }
      .dev-body {
        flex: 1;
      }
      .dev-label {
        font-weight: 700;
        color: #1f2937;
        font-size: 1rem;
      }
      .dev-meta {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 0.2rem;
      }
      .dev-tag {
        display: inline-block;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        margin-right: 0.3rem;
      }
      .dev-tag.cur {
        background: #22c55e;
        color: #fff;
      }
      .dev-tag.act {
        background: #dbeafe;
        color: #1e40af;
      }
      .dev-tag.old {
        background: #f3f4f6;
        color: #6b7280;
      }
      .kick-btn {
        background: #fff;
        border: 1.5px solid #fca5a5;
        color: #dc2626;
        border-radius: 8px;
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }
      .kick-btn:hover {
        background: #fef2f2;
      }
      .kick-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .cur-btn {
        color: #16a34a;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .foot {
        text-align: center;
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 2rem;
      }
      #need-login {
        text-align: center;
        padding: 2rem 1rem;
        color: #6b7280;
      }
      #need-login a {
        color: #3b82f6;
        font-weight: 700;
      }
      #loading {
        text-align: center;
        color: #9ca3af;
        padding: 2rem;
      }
    </style>
      <link rel="stylesheet" href="skin.css?v=v" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <a href="index.html" class="back">← <span data-site="homeLabel">牙醫主頁</span></a>
        <span style="font-size: 0.75rem; color: #9ca3af" id="ver"></span>
      </div>
      <h1>🖥️ 裝置管理</h1>
      <p class="sub-title">妳的訂閱最多可在 <b>3 台裝置</b>使用</p>

      <div id="need-login" style="display: none">
        請先<a href="index.html">回<span data-site="homeLabel">牙醫主頁</span></a>用 Google 登入才能管理裝置
      </div>

      <div id="over-warn" class="warn" style="display: none">
        ⚠️ <b>已達 3 台裝置上限</b>,超過的裝置會被暫時擋下。<br />
        請踢掉一台舊裝置，再回原本那台重新整理就會解鎖。
      </div>

      <div class="hint">
        💡 <b>什麼算 1 台裝置?</b> 每台電腦/手機/瀏覽器都是一台。<br />
        清瀏覽器快取後會被算成新的一台;無痕模式每次都算新的。
      </div>

      <div id="loading">載入中...</div>
      <div id="dev-list"></div>

      <p class="foot">
        © 2026 <span data-site="fullName"></span> · v<span id="v"></span>
      </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="auth.js?v=v"></script>
    <script src="device-guard.js?v=v"></script>
    <script>
      document.getElementById("v").textContent = (
        window.APP_VERSION || ""
      ).replace(/^v/, "");
      document.getElementById("ver").textContent = window.APP_VERSION || "";

      function pickIcon(label) {
        if (/iPhone/i.test(label)) return "📱";
        if (/iPad/i.test(label)) return "📱";
        if (/Android/i.test(label)) return "📱";
        if (/Mac/i.test(label)) return "💻";
        if (/Windows/i.test(label)) return "🖥️";
        if (/Linux/i.test(label)) return "🖥️";
        return "🖥️";
      }

      function fmtDate(ts) {
        if (!ts) return "-";
        const d = new Date(ts);
        return (
          d.getFullYear() +
          "/" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "/" +
          String(d.getDate()).padStart(2, "0") +
          " " +
          String(d.getHours()).padStart(2, "0") +
          ":" +
          String(d.getMinutes()).padStart(2, "0")
        );
      }

      function fmtAgo(ts) {
        if (!ts) return "";
        const diff = Date.now() - ts;
        if (diff < 60000) return "剛剛";
        if (diff < 3600000) return Math.floor(diff / 60000) + " 分鐘前";
        if (diff < 86400000) return Math.floor(diff / 3600000) + " 小時前";
        return Math.floor(diff / 86400000) + " 天前";
      }

      async function refreshList() {
        const status = await DeviceGuard.registerAndCheck();
        document.getElementById("loading").style.display = "none";
        const list = document.getElementById("dev-list");
        if (!status.devices || status.devices.length === 0) {
          list.innerHTML =
            '<div style="text-align:center;color:#9ca3af;padding:2rem">沒有裝置紀錄</div>';
          return;
        }
        document.getElementById("over-warn").style.display =
          status.devices.length > status.max ? "block" : "none";

        const MAX = status.max || 3;
        list.innerHTML = status.devices
          .map((d, i) => {
            const isCurrent = d._id === status.current;
            const isActive = i < MAX;
            const rowCls = isCurrent
              ? "device-row current"
              : isActive
                ? "device-row"
                : "device-row inactive";
            const tag = isCurrent
              ? '<span class="dev-tag cur">✅ 當前這台</span>'
              : isActive
                ? '<span class="dev-tag act">使用中</span>'
                : '<span class="dev-tag old">已超額 (被擋)</span>';
            const actionBtn = isCurrent
              ? '<span class="cur-btn">✅ 使用中</span>'
              : `<button class="kick-btn" onclick="kickDevice('${d._id}','${(d.label || "").replace(/'/g, "")}')">✕ 踢掉</button>`;
            return `
            <div class="${rowCls}">
              <div class="dev-icon">${pickIcon(d.label || "")}</div>
              <div class="dev-body">
                <div>${tag}<span class="dev-label">${escape(d.label || "未知裝置")}</span></div>
                <div class="dev-meta">
                  最後使用: ${fmtDate(d.last_seen)} (${fmtAgo(d.last_seen)})
                  · 首次登入: ${fmtDate(d.first_seen)}
                </div>
              </div>
              <div>${actionBtn}</div>
            </div>
          `;
          })
          .join("");
      }

      function escape(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      async function kickDevice(deviceId, label) {
        if (
          !confirm(
            "確定要踢掉這台裝置嗎?\n\n" +
              label +
              "\n\n下次那台再開就要重新使用一個裝置額度。",
          )
        )
          return;
        try {
          await DeviceGuard.removeDevice(deviceId);
          alert("✅ 已踢掉");
          refreshList();
        } catch (e) {
          alert("失敗: " + e.message);
        }
      }
      window.kickDevice = kickDevice;

      function boot() {
        const user = window.Auth ? window.Auth.getUser() : null;
        if (!user) {
          document.getElementById("need-login").style.display = "block";
          document.getElementById("loading").style.display = "none";
          return;
        }
        refreshList();
      }

      // v539: 只靠 onChange (已 ready 會立刻補呼),不再 800ms 硬 render
      if (window.Auth && window.Auth.onChange) {
        window.Auth.onChange(boot);
      }
    </script>
      <script src="tour.js?v=v" defer></script>
</body>
</html>
