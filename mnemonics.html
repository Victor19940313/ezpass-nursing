      // ──────────────────────────────────────────────────────────
      // v329:複製章節連結 + 解析 URL hash 深連結
      //      hash 格式:#ns=HUA&subj=ya5&ch=ch_xxx
      // ──────────────────────────────────────────────────────────
      function copyChapterLink() {
        if (!_curChapterId) {
          showToast("請先選一章再複製");
          return;
        }
        const ch = _findCh(_curUser, _curSubject, _curChapterId);
        // v581: 只有公開的章節能複製連結 (HUA: 複製連結要開共享的,可以貼到考題留言區)
        if (ch && !isChPublic(_curUser, ch)) {
          showToast(canEditCurrent() ? "先打開「公開」才能複製連結 (私人章節別人打不開)" : "這章沒有公開,不能複製連結");
          return;
        }
        const hash = `#n=${encodeURIComponent(_curUser)}&s=${_curSubject}&c=${encodeURIComponent(_curChapterId)}`;
        const url = location.origin + location.pathname + hash;
        const title = ch ? ch.title : "章節";
        const fallback = () => {
          const ta = document.createElement("textarea");
          ta.value = url;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            showToast(`🔗 已複製「${title}」的連結`);
          } catch (e) {
            showToast("複製失敗，請手動複製:" + url);
          }
          document.body.removeChild(ta);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(
            () => showToast(`🔗 已複製「${title}」的連結,可以貼到考題的留言區`),
            () => fallback(),
          );
        } else {
          fallback();
        }
      }

      // 解析 URL hash,跳到指定 (ns, subj, ch)。同時接受 n/s/c(短)和 ns/subj/ch(舊版)
      async function _applyDeepLinkFromHash() {
        const h = location.hash || "";
        if (!h.startsWith("#")) return false;
        const params = {};
        h.slice(1)
          .split("&")
          .forEach((kv) => {
            const [k, v] = kv.split("=");
            if (k) params[k] = decodeURIComponent(v || "");
          });
        const ns = params.n || params.ns;
        const subj = params.s || params.subj;
        const ch = params.c || params.ch;
        if (!ns && !subj && !ch) return false;
        const targetSubj = subj && SITE.SUBJ_CODES.includes(subj) ? subj : _curSubject;
        if (ns && ns !== myNs()) {
          // 別人的章節 → 走「大家分享的」,而且必須是公開的
          await switchMode("pub", { silent: true });
          await ensurePubIndex(targetSubj);
          if (_curSubject !== targetSubj) await switchSubject(targetSubj);
          const idx = _pubIndex[targetSubj] || {};
          const entry = idx[pubKey(ns, ch)];
          if (!ch || !entry || entry.hidden || _takedown[pubKey(ns, ch)]) {
            showToast("這章沒有公開,或已被使用者收回");
            renderChapterList();
            renderPubList();
            return true;
          }
          await openPubChapter(ns, targetSubj, ch);
          return true;
        }
        if (_mode !== "mine") await switchMode("mine", { silent: true });
        if (_curSubject !== targetSubj) await switchSubject(targetSubj);
        if (ch) {
          let tries = 30;
          const tryPick = () => {
            const sj = curState();
            if (sj && sj.chapters && sj.chapters.find((c) => c.id === ch)) {
              pickChapter(ch);
              return;
            }
            if (--tries > 0) setTimeout(tryPick, 100);
          };
          tryPick();
        }
        return true;
      }

      // v330:供留言裡的章節 pill 點擊用 — 改 hash → hashchange listener 接手
      function jumpToChapterLink(ev, ns, subj, ch) {
        if (ev) ev.preventDefault();
        const newHash = `#n=${encodeURIComponent(ns)}&s=${encodeURIComponent(subj)}&c=${encodeURIComponent(ch)}`;
        if (location.hash === newHash) {
          // 同樣 hash 不觸發 hashchange,直接 call
          _applyDeepLinkFromHash();
        } else {
          location.hash = newHash;
        }
        return false;
      }
      // 監聽 hash 改變(留言裡點連結，網址只是 hash 換，不會 reload)
      window.addEventListener("hashchange", () => {
        _applyDeepLinkFromHash();
      });

      // ──────────────────────────────────────────────────────────
      // v329:章節搜尋(目前 namespace 跨四科)

      let _searchTimer = null;
      async function onChSearch() {
        clearTimeout(_searchTimer);
        _searchTimer = setTimeout(() => doSearch(), 200);
      }
      async function doSearch() {
        const inp = document.getElementById("ch-search");
        const q = (inp ? inp.value : "").trim().toLowerCase();
        if (!q) {
          renderChapterList();
          if (_mode !== "mine" && !_curChapterId) renderPubList();
          return;
        }
        const SUBJECTS = SITE.SUBJ_CODES;
        const hits = [];
        if (_mode === "mine") {
          const ns = myNs();
          if (!ns) return;
          await Promise.all(
            SUBJECTS.map(async (sub) => {
              const sk = stateKey(ns, sub);
              if (_state[sk] && _state[sk].chapters) return;
              const cache = await idbGet(k.cloud(ns, sub));
              if (cache && cache.chapters) _state[sk] = cache;
              else {
                try {
                  const remote = await fbGet(FB_CONTENT(ns, sub));
                  if (remote && remote.chapters) {
                    _state[sk] = remote;
                    await idbSet(k.cloud(ns, sub), remote);
                  }
                } catch (e) {}
              }
            }),
          );
          for (const sub of SUBJECTS) {
            const sj = _state[stateKey(ns, sub)];
            if (!sj || !sj.chapters) continue;
            sj.chapters.forEach((ch) => {
              const title = (ch.title || "").toLowerCase();
              const plain = (ch.content || "").replace(/<[^>]+>/g, " ").toLowerCase();
              if (title.includes(q) || plain.includes(q) || (ch.topic || "").toLowerCase().includes(q)) {
                let snippet = "";
                const idx = plain.indexOf(q);
                if (idx >= 0) {
                  const start = Math.max(0, idx - 20);
                  snippet = (start > 0 ? "…" : "") + plain.slice(start, idx + q.length + 30).trim();
                }
                hits.push({ ns, subj: sub, ch, snippet });
              }
            });
          }
        } else if (_mode === "pub") {
          // v579: 大家分享的也要搜得到「內容」— 把索引裡出現的作者/科目內容拉進來 (有快取),再搜標題/分類/內文
          await Promise.all(SUBJECTS.map((sub) => ensurePubIndex(sub)));
          const need = [];
          for (const sub of SUBJECTS) {
            const idx = _pubIndex[sub] || {};
            Object.values(idx).forEach((e) => {
              if (!e || e.hidden || !e.ns) return;
              const sk = stateKey(e.ns, sub);
              if (!(_state[sk] && _state[sk].chapters) && !need.some((x) => x.sk === sk)) need.push({ ns: e.ns, sub, sk });
            });
          }
          await Promise.all(
            need.map(async ({ ns, sub, sk }) => {
              try {
                const cache = await idbGet(k.cloud(ns, sub));
                if (cache && cache.chapters) _state[sk] = cache;
                const remote = await fbGet(FB_CONTENT(ns, sub));
                if (remote && remote.chapters) {
                  _state[sk] = remote;
                  await idbSet(k.cloud(ns, sub), remote);
                }
              } catch (e) {}
            }),
          );
          for (const sub of SUBJECTS) {
            const idx = _pubIndex[sub] || {};
            Object.entries(idx).forEach(([key, e]) => {
              if (!e || e.hidden || _takedown[key]) return;
              const st = _state[stateKey(e.ns, sub)];
              const ch = st && st.chapters ? st.chapters.find((c) => c.id === e.ch) : null;
              const plain = ch ? (ch.content || "").replace(/<[^>]+>/g, " ").toLowerCase() : "";
              const inTitle = (e.title || "").toLowerCase().includes(q);
              const inTopic = (e.topic || "").toLowerCase().includes(q);
              const inBody = plain.includes(q);
              if (inTitle || inTopic || inBody) {
                let snippet = `${e.topic || "未分類"} · ${e.author || ""} · 👍 ${e.likes || 0}`;
                if (inBody && !inTitle) {
                  const i = plain.indexOf(q);
                  const start = Math.max(0, i - 18);
                  snippet = (start > 0 ? "…" : "") + plain.slice(start, i + q.length + 28).trim() + " · " + (e.author || "");
                }
                hits.push({ ns: e.ns, subj: sub, ch: { id: e.ch, title: e.title }, snippet, pub: true });
              }
            });
          }
        } else {
          Object.entries(_favs).forEach(([key, fv]) => {
            if ((fv.title || "").toLowerCase().includes(q) || (fv.topic || "").toLowerCase().includes(q)) {
              hits.push({ ns: fv.ns, subj: fv.subj, ch: { id: fv.ch, title: fv.title }, snippet: fv.topic || "", pub: true });
            }
          });
        }
        renderSearchResults(hits, q);
      }
      function renderSearchResults(hits, q) {
        const container = document.getElementById("ch-items");
        if (!container) return;
        if (!hits.length) {
          container.innerHTML = `<div style="padding:1rem .5rem;color:var(--text-sub);text-align:center;font-size:.85rem">找不到「${escapeHtml(q)}」</div>`;
          return;
        }
        container.innerHTML =
          `<div style="font-size:.74rem;color:var(--text-sub);padding:.3rem .35rem .55rem">🔍 ${hits.length} 個結果</div>` +
          hits
            .map((h) => {
              const subjLbl = SUBJECT_LABEL[h.subj] || h.subj;
              const safeNs = String(h.ns).replace(/['"\\]/g, "");
              return `<div class="ch-item" style="border-left:3px solid var(--mn-accent);padding-left:.5rem" onclick="gotoSearchHit('${safeNs}','${h.subj}','${h.ch.id}',${h.pub ? "true" : "false"})">
          <div style="display:flex;flex-direction:column;gap:.15rem;width:100%">
            <div style="display:flex;gap:.3rem;align-items:center;flex-wrap:wrap">
              <span style="background:var(--mn-accent);color:white;font-size:.65rem;padding:.05rem .35rem;border-radius:8px;font-weight:700">${subjLbl}</span>
              <span class="ch-title" style="font-weight:700">${escapeHtml(h.ch.title || "(無標題)")}</span>
            </div>
            ${h.snippet ? `<div style="font-size:.74rem;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(h.snippet)}</div>` : ""}
          </div>
        </div>`;
            })
            .join("");
      }
      async function gotoSearchHit(ns, subj, chId, isPub) {
        const inp = document.getElementById("ch-search");
        if (inp) inp.value = "";
        if (isPub || ns !== myNs()) {
          await openPubChapter(ns, subj, chId);

      function renderChapterList() {
        const container = document.getElementById("ch-items");
        const head = document.getElementById("ch-head-label");
        const addBtn = document.getElementById("btn-add-ch");
        if (addBtn) addBtn.classList.toggle("hidden", !(_mode === "mine" && canEditCurrent()));
        if (_mode === "pub") return renderPubTopics(container, head);
        if (_mode === "favs") return renderFavList(container, head);
        const subj = curState() || { chapters: [] };
        head.textContent = `${SUBJECT_LABEL[_curSubject]} · ${subj.chapters.length} 章`;
        if (subj.chapters.length === 0) {
          container.innerHTML = `<div class="empty">還沒有章節<br>${canEditCurrent() ? "按上方「+ 新增」開始" : "這裡是空的"}</div>`;
          return;
        }
        // 依分類分組;沒選分類的放最後「還沒分類」
        const groups = new Map();
        subj.chapters.forEach((ch) => {
          const key = ch.topic || "";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(ch);
        });
        const order = (window.TOPICS && window.TOPICS[_curSubject]) || [];
        const keys = [...groups.keys()].filter((x) => x).sort((a, b) => {
          const ia = order.indexOf(a), ib = order.indexOf(b);
          return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b, "zh-Hant");
        });
        if (groups.has("")) keys.push("");
        const openSet = _openTopicGroups();
        container.innerHTML = keys
          .map((key) => {
            const list = groups.get(key);
            const isOpen = openSet.has(key) || keys.length <= 3 || list.some((c) => c.id === _curChapterId);
            const label = key || "還沒分類";
            return `<details class="topic-group ${key ? "" : "untagged"}" ${isOpen ? "open" : ""} ontoggle="_onTopicToggle(this,'${escapeHtml(key).replace(/'/g, "&#39;")}')">
          <summary><span class="arr">▶</span>${key ? "" : "⚠️ "}${escapeHtml(label)}<span class="n">${list.length}</span></summary>
          ${list
            .map((ch) => {
              const active = ch.id === _curChapterId;
              const pub = isChPublic(_curUser, ch);
              const vis = ch.forkFrom ? "📋🔒" : pub ? `🌐${ch.likes ? " 👍" + ch.likes : ""}` : "🔒";
              return `<div class="ch-item ${active ? "active" : ""} ${ch.forkFrom ? "forked" : ""}" onclick="pickChapter('${ch.id}')" title="${ch.forkFrom ? "複製自 " + escapeHtml(ch.forkFrom.author || "") + ",不能公開" : pub ? "公開中" : "只給自己看"}">
            <span class="ch-title ${ch.hasMn ? "has-mn" : ""}" title="${ch.hasMn ? "已有口訣" : ""}">${escapeHtml(ch.title || "(無標題)")}</span>
            <span class="ch-vis">${vis}</span>
            ${canEditCurrent() ? `<button class="ch-del" onclick="event.stopPropagation();deleteChapter('${ch.id}')" title="刪除這章">🗑</button>` : ""}
          </div>`;
            })
            .join("")}
        </details>`;
          })
          .join("");
      }

      // v388: 章節拖曳排序
      let _dragChId = null;
      function _dragChStart(e, id) {
        _dragChId = id;
        e.dataTransfer.effectAllowed = "move";
        e.currentTarget.classList.add("dragging");
      }
      function _dragChOver(e) {
        if (!_dragChId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        e.currentTarget.classList.add("drag-over");
      }
      function _dragChLeave(e) {
        e.currentTarget.classList.remove("drag-over");
      }
      function _dragChEnd(e) {
        e.currentTarget.classList.remove("dragging");
        document
          .querySelectorAll(".ch-item.drag-over")
          .forEach((el) => el.classList.remove("drag-over"));
      }
      async function _dragChDrop(e, targetId) {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        const fromId = _dragChId;
        _dragChId = null;
        if (!fromId || fromId === targetId) return;
        await reorderChapters(fromId, targetId);
      }
      async function reorderChapters(fromId, toId) {
        if (!canEditCurrent()) return;
        const subj = curState();
        if (!subj || !Array.isArray(subj.chapters)) return;
        const fromIdx = subj.chapters.findIndex((c) => c.id === fromId);
        const toIdx = subj.chapters.findIndex((c) => c.id === toId);
        if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
        const [moved] = subj.chapters.splice(fromIdx, 1);
        // 插入到 target 位置 (拖到誰前面就放誰前面)
        const newToIdx = subj.chapters.findIndex((c) => c.id === toId);
        subj.chapters.splice(newToIdx, 0, moved);
        subj.ts = Date.now();
        subj.updatedBy = CUR_USER.name || "Guest";
        await idbSet(k.cloud(_curUser, _curSubject), subj);
        renderChapterList();
        try {
          await fbSet(FB_CONTENT(_curUser, _curSubject), subj);
          await fbAppendVersion(_curUser, _curSubject, {
            ts: subj.ts,
            by: CUR_USER.name,
            action: `調整章節順序`,
            snapshot: subj,
          });
        } catch (err) {
          console.error("[reorder fb] fail", err);
          showToast(
            "本機已動，雲端同步失敗:" + (err.message || "").slice(0, 50),
          );
        }
      }

      // v329:把本機 IDB 裡 cloud_腦動大開_* / draft_腦動大開_* 自動搬到 腦洞大開，避免 Shirley 在 Mac 寫的「咬合修磨」丟失
      async function _migrateLocalChineseTypo() {
        const flag = "mn_migrated_typo_v329";
        if (localStorage.getItem(flag)) return;
        const SUBJECTS = SITE.SUBJ_CODES;

          }
          if (old) await idbDel(oldCloud);
        }
        try {
          localStorage.setItem(flag, "1");

      }

          /[&<>"']/g,

            ({

              '"': "&quot;",
              "'": "&#39;",

      }

      }

      function refreshStatusUI() {
        const subj = curState();
        const ch = subj && _curChapterId ? subj.chapters.find((c) => c.id === _curChapterId) : null;
        const $ = (id) => document.getElementById(id);
        const editBtn = $("edit-btn"), saveBtn = $("save-btn"), abandonBtn = $("abandon-btn");
        const undoBtn = $("undo-btn"), redoBtn = $("redo-btn"), histBtn = $("history-btn");
        const linkBtn = $("link-btn"), tb = $("toolbar"), titleInput = $("title-input");
        const pubT = $("pub-toggle"), topicBtn = $("topic-btn"), likeBtn = $("like-btn"), favBtn = $("fav-btn"), mnBtn = $("hasmn-btn");
        const forkBtn = $("fork-btn"), reportBtn = $("report-btn"), tdBtn = $("takedown-btn");
        const hide = (...els) => els.forEach((e) => e && (e.style.display = "none"));
        const show = (...els) => els.forEach((e) => e && (e.style.display = ""));
        hide(editBtn, saveBtn, abandonBtn, undoBtn, redoBtn, histBtn, linkBtn, pubT, topicBtn, likeBtn, favBtn, forkBtn, reportBtn, tdBtn, mnBtn);
        tb.style.display = "none";
        titleInput.disabled = true;
        if (!_curChapterId || !ch) {
          // nothing
        } else if (!canEditCurrent()) {
          // 別人的公開章節:讚 / 收藏 / 複製 / 檢舉 / 連結 / 歷史;管理者多一個下架
          show(linkBtn, likeBtn, favBtn, forkBtn, reportBtn);
          if (isAdmin()) show(tdBtn);
        } else if (_editMode) {
          show(saveBtn, abandonBtn);
          saveBtn.disabled = !_dirty;
          saveBtn.textContent = _dirty ? "💾 儲存" : "💾 已存";
          tb.style.display = "flex";
          titleInput.disabled = false;
        } else {
          show(editBtn, linkBtn, pubT, topicBtn, mnBtn); // v595: 歷史鈕拿掉 (HUA: 不太重要);版本仍照存,要救回時 openVersionModal() 還在
          editBtn.textContent = "✏ 編輯";
          mnBtn.classList.toggle("on", !!ch.hasMn);
          mnBtn.textContent = ch.hasMn ? "✅ 已有口訣" : "☐ 已有口訣";
          if (_undoMap[_curChapterId]) show(undoBtn);
          if (_redoMap[_curChapterId]) show(redoBtn);
          // 公開開關狀態
          const chk = $("pub-check"), lab = $("pub-label");
          const forked = !!ch.forkFrom;
          const down = !!_takedown[pubKey(_curUser, ch.id)];
          chk.checked = !!ch.pub && !forked;
          chk.disabled = forked || down;
          pubT.classList.toggle("disabled", forked || down);
          pubT.title = forked ? "複製來的章節不能公開" : down ? "已被管理者下架" : ch.pub ? "點一下改回只給自己看" : "公開分享給大家 (需先選分類)";
          lab.textContent = forked ? "複製品 · 不能公開" : down ? "已下架" : ch.pub ? "公開分享中" : "只給自己看";
          topicBtn.textContent = ch.topic ? "🏷 " + ch.topic : "🏷 選分類";
        }
        const chAdd = $("btn-add-ch");
        if (chAdd) chAdd.classList.toggle("hidden", !(_mode === "mine" && canEditCurrent()));
        const imgTbar = $("img-toolbar");
        if (imgTbar && !_editMode) imgTbar.classList.remove("visible");
      }

      // v325:圖片放大 lightbox(跟筆記本同樣 UX)
      // v327:改用 addEventListener,確保「點背景任何地方」「點圖片自己」「按 Esc」三種都能關
      function openImgLightbox(src) {
        const img = document.getElementById("img-lightbox-img");
        const box = document.getElementById("img-lightbox");
        if (!img || !box) return;
        img.src = src;
        box.style.display = "flex";
      }
      function closeImgLightbox() {
        const box = document.getElementById("img-lightbox");
        if (box) box.style.display = "none";
      }
      // 綁定關閉:整個 lightbox 範圍任何地方點下去都關
      (function bindLightboxClose() {
        const box = document.getElementById("img-lightbox");
        if (!box) {
          setTimeout(bindLightboxClose, 16);
          return;
        }
        box.addEventListener("click", () => closeImgLightbox());
      })();
      // 閱覽模式下點圖片 → 開 lightbox(事件代理,view-content 重渲染後也有效)
      document.addEventListener("click", (e) => {
        if (_editMode) return; // 編輯模式交給 TipTap
        const t = e.target;
        if (
          t &&
          t.tagName === "IMG" &&
          t.closest &&
          t.closest(".view-content")
        ) {
          e.preventDefault();
          e.stopPropagation();
          openImgLightbox(t.src);
        }
      });
      // Esc 關
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeImgLightbox();
      });

      // 切換閱覽 / 編輯(編輯模式才 lazy load TipTap)
      async function toggleEditMode() {
        if (!canEditCurrent()) {
          showToast("🔒 沒有編輯權限");
          return;
        }
        if (!_curChapterId) {
          showToast("請先從左邊選一章，或按「+ 新增」");
          return;
        }
        if (!_editMode) {
          // 進入編輯:lazy load TipTap(只第一次需要載)
          const body = document.getElementById("editor-body");
          const subj = curState();
          const ch = subj && subj.chapters.find((c) => c.id === _curChapterId);
          if (!ch) return;
          // 拿掉 viewer 並顯示載入
          const draft = await idbGet(
            k.draft(_curUser, _curSubject, _curChapterId),
          );
          const initialHTML =
            (draft && draft.content) || ch.content || "<p></p>";
          body.innerHTML =
            '<div style="text-align:center;padding:2rem;color:#9ca3af">⏳ 載入編輯器…</div>';
          try {
            await initEditorOnce();
            if (_editor) {
              _editor.commands.setContent(initialHTML);
              _editor.setEditable(true);
              _editMode = true;
              _dirty = !!draft;
              refreshStatusUI();
              _editor.commands.focus();
              // v608: 第一次進編輯提示貼圖小撇步 (HUA)
              try {
                if (!localStorage.getItem("mn_paste_tip_seen")) {
                  localStorage.setItem("mn_paste_tip_seen", "1");
                  showToast("📸 小撇步：電腦截圖後直接 Ctrl+V 就貼進來（Windows 按 Win+Shift+S；Mac 按 Cmd+Ctrl+Shift+4）。要先設定 GitHub token。");
                }
              } catch (e) {}
            }
          } catch (e) {
            body.innerHTML =
              '<div style="padding:1.5rem;color:#dc2626;text-align:center">❌ 編輯器載入失敗:' +
              e.message +
              "<br><br>網路問題，刷新重試</div>";
          }
        } else {
          // 回閱覽模式
          if (
            _dirty &&
            !confirm("有未儲存的草稿，要切回閱覽嗎?(草稿會保留在 IDB,不會掉)")
          )
            return;
          // 把目前內容存回 draft(若有 dirty)
          if (_dirty && _editor) {
            await idbSet(k.draft(_curUser, _curSubject, _curChapterId), {
              content: _editor.getHTML(),
              title: document.getElementById("title-input").value,
              ts: Date.now(),
            });
          }
          _editMode = false;
          const subj = curState();
          const ch = subj && subj.chapters.find((c) => c.id === _curChapterId);
          if (_editor) {
            try {
              _editor.destroy();
            } catch (e) {}
            _editor = null;
          }
          const body = document.getElementById("editor-body");
          body.innerHTML =
            '<div class="view-content">' + (ch ? ch.content : "") + "</div>";
          refreshStatusUI();
        }
      }

      // 儲存後切回閱覽
      async function saveAndExit() {
        if (!_curChapterId) return;
        // 記下儲存前的內容當作 undo 點
        const subj = curState();
        const ch = subj && subj.chapters.find((c) => c.id === _curChapterId);
        if (ch) {
          _undoMap[_curChapterId] = { title: ch.title, content: ch.content };
          delete _redoMap[_curChapterId]; // 新的儲存會清掉 redo
        }
        await saveToCloud();
        if (!_dirty) {
          _editMode = false;
          if (_editor) {
            try {
              _editor.destroy();
            } catch (e) {}
            _editor = null;
          }
          const subj = curState();
          const ch =
            subj &&
            _curChapterId &&
            subj.chapters.find((c) => c.id === _curChapterId);
          const body = document.getElementById("editor-body");
          body.innerHTML =
            '<div class="view-content">' + (ch ? ch.content : "") + "</div>";
          refreshStatusUI();
        }
      }

      // 放棄儲存:回到上次儲存的內容，退出編輯
      async function discardChanges() {
        if (!canEditCurrent() || !_curChapterId) return;
        if (_dirty && !confirm("放棄目前所有修改，回到上次儲存的版本?")) return;
        await idbDel(k.draft(_curUser, _curSubject, _curChapterId));
        const subj = curState();
        const ch = subj && subj.chapters.find((c) => c.id === _curChapterId);
        _dirty = false;
        _editMode = false;
        if (_editor) {
          try {
            _editor.destroy();
          } catch (e) {}
          _editor = null;
        }
        const body = document.getElementById("editor-body");
        body.innerHTML =
          '<div class="view-content">' + (ch ? ch.content : "") + "</div>";
        if (ch) document.getElementById("title-input").value = ch.title || "";
        refreshStatusUI();
        showToast("已放棄修改");
      }

      // 回復:把章節內容換回上次儲存前的版本(同時排入 redo)
      async function undoLastSave() {
        if (!canEditCurrent() || !_curChapterId) return;
        const prev = _undoMap[_curChapterId];
        if (!prev) {
          showToast("沒有可回復的版本");
          return;
        }
        if (
          !confirm(
            "回復到上次儲存前的版本?\n\n(目前內容會放進「取消回復」可以救回來)",
          )
        )
          return;
        const subj = curState();
        const ch = subj && subj.chapters.find((c) => c.id === _curChapterId);
        if (!ch) return;
        _redoMap[_curChapterId] = { title: ch.title, content: ch.content };
        ch.title = prev.title;
        ch.content = prev.content;
        ch.ts = Date.now();
        ch.updatedBy = CUR_USER.name || "Guest";
        delete _undoMap[_curChapterId];
        _dirty = true;
        if (_editor) _editor.commands.setContent(prev.content || "<p></p>");
        document.getElementById("title-input").value = prev.title || "";
        await saveToCloud();
        refreshStatusUI();
        showToast("已回復");
      }

      async function redoLastUndo() {
        if (!canEditCurrent() || !_curChapterId) return;
        const r = _redoMap[_curChapterId];
        if (!r) {
          showToast("沒有可取消的回復");
          return;
        }
        const subj = curState();
        const ch = subj && subj.chapters.find((c) => c.id === _curChapterId);
        if (!ch) return;
        _undoMap[_curChapterId] = { title: ch.title, content: ch.content };
        ch.title = r.title;
        ch.content = r.content;
        ch.ts = Date.now();
        ch.updatedBy = CUR_USER.name || "Guest";
        delete _redoMap[_curChapterId];
        _dirty = true;
        if (_editor) _editor.commands.setContent(r.content || "<p></p>");
        document.getElementById("title-input").value = r.title || "";
        await saveToCloud();
        refreshStatusUI();
        showToast("已取消回復");
      }

      function onTitleChange() {
        if (!_curChapterId || !canEditCurrent()) return;
        _dirty = true;
        refreshStatusUI();
      }

      // ──────────────────────────────────────────────────────────
      // 章節操作
      // ──────────────────────────────────────────────────────────
      async function addChapter() {
        if (!canEditCurrent()) {
          if (!myUid()) showToast("請先登入");
          else showToast("先切到「我的口訣」再新增");
          return;
        }
        const title = prompt(`在「${SUBJECT_LABEL[_curSubject]}」新增章節，標題:`, "新章節");
        if (!title || !title.trim()) return;
        window._tpdHasMn = false;
        window._tpdHasMnResult = false;
        const topic = await pickTopicDialog(null, "這章屬於哪個分類? (之後也能改;不選就先放「還沒分類」)", true);
        let subj = curState();
        if (!subj) {
          subj = { chapters: [], ts: 0, updatedBy: "" };
          _state[stateKey(_curUser, _curSubject)] = subj;
        }
        if (!subj.chapters) subj.chapters = [];
        const newCh = {
          id: genChId(),
          title: title.trim(),
          content: "<p></p>",
          ts: Date.now(),
          updatedBy: myName(),
          topic: topic || "",
          hasMn: !!window._tpdHasMnResult,
          pub: false,
        };
        subj.chapters.push(newCh);
        subj.ts = Date.now();
        subj.updatedBy = myName();
        await idbSet(k.cloud(_curUser, _curSubject), subj);
        _dirty = true;
        await pickChapter(newCh.id);
        await toggleEditMode();
        _dirty = true;
        refreshStatusUI();
        showToast("新章節已建立,寫完按 💾 儲存 (預設只有你看得到)");
      }

      async function deleteChapter(chId) {
        if (!canEditCurrent()) return;
        const subj = curState();
        if (!subj) return;
        const ch = subj.chapters.find((c) => c.id === chId);
        if (!ch) return;
        if (!confirm(`刪除「${ch.title}」?\n\n刪掉後可從「📜 歷史」找回上一次儲存的版本。`)) return;
        subj.chapters = subj.chapters.filter((c) => c.id !== chId);
        subj.ts = Date.now();
        subj.updatedBy = myName();
        await idbDel(k.draft(_curUser, _curSubject, chId));
        await idbSet(k.cloud(_curUser, _curSubject), subj);
        if (_curChapterId === chId) {
          _curChapterId = subj.chapters[0] ? subj.chapters[0].id : null;
          _editMode = false;
          if (_editor) _editor.setEditable(false);
          if (_curChapterId) await pickChapter(_curChapterId);
          else showEmptyEditor();
        }
        renderChapterList();
        showToast("🗑 刪除中…");
        try {
          await fbSet(FB_CONTENT(_curUser, _curSubject), subj);
          await fbAppendVersion(_curUser, _curSubject, { ts: subj.ts, by: myName(), action: `delete「${ch.title}」`, snapshot: subj });
          if (ch.pub) await removePubIndex(_curUser, _curSubject, ch.id);
          showToast("🗑 已刪除(雲端同步完成)");
        } catch (e) {
          console.error("[delete fb] fail", e);
          showToast("🗑 本機已刪，雲端同步失敗:" + (e.message || "").slice(0, 60));
        }
        renderRewardCard();
      }

      // ──────────────────────────────────────────────────────────
      // 雲端同步(v322:Firebase)
      // ──────────────────────────────────────────────────────────
      async function refreshFromCloud() {
        if (_dirty) {
          if (!confirm("有未儲存草稿，刷新會用雲端版覆蓋。要繼續?")) return;
          if (_curChapterId)
            await idbDel(k.draft(_curUser, _curSubject, _curChapterId));
        }
        showToast("🔄 拉雲端最新…");
        const remote = await fbGet(FB_CONTENT(_curUser, _curSubject));
        if (remote && remote.chapters) {
          _state[stateKey(_curUser, _curSubject)] = remote;
          await idbSet(k.cloud(_curUser, _curSubject), remote);
          renderChapterList();
          if (_curChapterId) {
            const ch = remote.chapters.find((c) => c.id === _curChapterId);
            if (ch && _editor) {
              _editor.commands.setContent(ch.content || "<p></p>");
              document.getElementById("title-input").value = ch.title || "";
            }
          }
          _dirty = false;
          refreshStatusUI();
          showToast("✓ 已是最新");
        } else {
          showToast("❌ 拉不到(可能還沒人推過)");
        }
      }

      async function saveToCloud() {
        if (!canEditCurrent()) return;
        const subj = curState();
        if (!subj) {
          showToast("沒有內容");
          return;
        }
        let curCh = null;
        if (_curChapterId) {
          curCh = subj.chapters.find((c) => c.id === _curChapterId);
          if (curCh && _editor) {
            const newTitle = document.getElementById("title-input").value.trim() || curCh.title;
            curCh.title = newTitle;
            curCh.content = _editor.getHTML();
            curCh.ts = Date.now();
            curCh.updatedBy = myName();
          }
        }
        subj.ts = Date.now();
        subj.updatedBy = myName();
        const btn = document.getElementById("save-btn");
        btn.disabled = true;
        btn.textContent = "⏳ 推送中…";
        try {
          await fbSet(FB_CONTENT(_curUser, _curSubject), subj);
          const chTitle = curCh ? curCh.title || "" : "";
          await fbAppendVersion(_curUser, _curSubject, { ts: subj.ts, by: myName(), action: chTitle ? `編輯「${chTitle}」` : "更新", snapshot: subj });
          await idbSet(k.cloud(_curUser, _curSubject), subj);
          if (_curChapterId) await idbDel(k.draft(_curUser, _curSubject, _curChapterId));
          if (curCh && curCh.pub) await upsertPubIndex(_curUser, _curSubject, curCh);
          _dirty = false;
          refreshStatusUI();
          renderChapterList();
          showToast("✅ 已儲存");
        } catch (e) {
          console.error("[saveToCloud] failed", e);
          alert("儲存失敗:" + (e.message || e) + "\n\n本機草稿還在 IDB,不會掉。");
          btn.disabled = false;
          btn.textContent = "💾 重試";
        }
      }

      // ──────────────────────────────────────────────────────────
      // 版本歷史 modal(v322:存 Firebase,保留最近 30 個快照)
      // ──────────────────────────────────────────────────────────
      async function openVersionModal() {
        showVersionModalContent(
          '<div style="text-align:center;padding:2rem;color:#9ca3af">⏳ 從雲端拉歷史…</div>',
        );
        try {
          const arr = await fbGet(FB_VERSIONS(_curUser, _curSubject));
          const versions = Array.isArray(arr)
            ? arr
            : arr && arr.list
              ? arr.list
              : [];
          if (!versions.length) {
            showVersionModalContent(
              '<div style="text-align:center;color:#9ca3af;padding:2rem">還沒有任何儲存紀錄</div>',
            );
            return;
          }
          // 反序顯示(最新在前)
          const sorted = versions.slice().reverse();
          window._versionList = sorted;
          const rows = sorted
            .map((v, i) => {
              const dt = v.ts ? new Date(v.ts).toLocaleString("zh-TW") : "";
              const action = v.action || "更新";
              return `<div class="version-row">
            <div class="v-info">
              <div class="v-title">${escapeHtml(action)}</div>
              <div class="v-meta">${escapeHtml(v.by || "?")} · ${dt}</div>
            </div>
            <div class="v-action">
              <button onclick="previewVersion(${i})">👁 預覽</button>
              ${canEditCurrent() ? `<button class="restore" onclick="restoreFromVersion(${i})">↶ 還原</button>` : ""}
            </div>
          </div>`;
            })
            .join("");
          showVersionModalContent(
            '<div style="font-size:.85rem;color:#6b7280">共 ' +
              sorted.length +
              " 個版本(保留最近 30 個，自動丟最舊)</div><br>" +
              rows,
          );
        } catch (e) {
          showVersionModalContent(
            '<div style="color:#dc2626;padding:1rem">❌ 拉歷史失敗: ' +
              e.message +
              "</div>",
          );
        }
      }

      async function previewVersion(idx) {
        const v = window._versionList && window._versionList[idx];
        if (!v || !v.snapshot) return;
        const data = v.snapshot;
        const ch = _curChapterId
          ? (data.chapters || []).find((x) => x.id === _curChapterId)
          : (data.chapters || [])[0];
        if (!ch) {
          showVersionModalContent(
            '<div style="color:#dc2626;padding:1rem">這版裡找不到目前章節(可能那時還沒建)</div><div style="margin-top:1rem"><button onclick="openVersionModal()" style="background:#f3f4f6;border:1px solid #e5e7eb;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:600">← 回列表</button></div>',
          );
          return;
        }
        const html =
          '<h3 style="margin-bottom:.5rem">' +
          escapeHtml(ch.title || "(無標題)") +
          "</h3>" +
          '<div class="version-preview">' +
          (ch.content || "<p>(空)</p>") +
          "</div>" +
          '<div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">' +
          '<button onclick="openVersionModal()" style="background:#f3f4f6;border:1px solid #e5e7eb;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:600">← 回列表</button>' +
          (canEditCurrent()
            ? '<button onclick="restoreFromVersion(' +
              idx +
              ')" style="background:#16a34a;color:white;border:none;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:700">↶ 還原到這版</button>'
            : "") +
          "</div>";
        showVersionModalContent(html);
      }

      async function restoreFromVersion(idx) {
        if (!canEditCurrent()) return;
        const v = window._versionList && window._versionList[idx];
        if (!v || !v.snapshot) return;
        if (
          !confirm(
            "還原到「" +
              new Date(v.ts || 0).toLocaleString("zh-TW") +
              "」的版本?\n\n會覆蓋當前章節內容，這次還原本身也會留新版本，之後可以再從歷史救回。",
          )
        )
          return;
        try {
          const data = v.snapshot;
          const ch = (data.chapters || []).find((x) => x.id === _curChapterId);
          if (!ch) {
            alert("這版找不到目前章節");
            return;
          }
          const subj = curState();
          const curCh = subj.chapters.find((x) => x.id === _curChapterId);
          _undoMap[_curChapterId] = {
            title: curCh.title,
            content: curCh.content,
          };
          curCh.title = ch.title;
          curCh.content = ch.content;
          curCh.ts = Date.now();
          curCh.updatedBy = CUR_USER.name || "Guest";
          _dirty = true;
          if (_editor) _editor.commands.setContent(ch.content || "<p></p>");
          document.getElementById("title-input").value = ch.title || "";
          closeVersionModal();
          await saveToCloud();
          refreshStatusUI();
          showToast("✅ 已還原");
        } catch (e) {
          alert("還原失敗:" + e.message);
        }
      }

      function showVersionModalContent(html) {
        let overlay = document.getElementById("version-modal");
        if (!overlay) {
          overlay = document.createElement("div");
          overlay.id = "version-modal";

      function startDraftAutoSave() {
        if (_draftTimer) clearInterval(_draftTimer);

      // ──────────────────────────────────────────────────────────
      // 編輯器初始化
      // ──────────────────────────────────────────────────────────
      let _coreModules = null;
      // 🛡 esm.sh 偶爾在手機掛掉，加 fallback CDN + 自動重試
      const CDN_BASES = [
        "https://esm.sh/",
        "https://esm.run/",
        "https://cdn.skypack.dev/",
      ];
      async function importWithFallback(path) {
        let lastErr = null;
        for (const base of CDN_BASES) {
          try {
            return await import(base + path);
          } catch (e) {
            lastErr = e;
            console.warn("[import retry]", base + path, e.message);
          }
        }
        // 全部失敗 → 再試 esm.sh 一次(也許是暫時 hiccup)
        try {
          return await import("https://esm.sh/" + path);
        } catch (e) {
          throw lastErr || e;
        }
      }
      async function loadTipTapModules() {
        if (_coreModules) return _coreModules;
        const [
          core,
          StarterKitMod,
          UnderlineMod,
          HighlightMod,
          TableMod,
          TableRowMod,
          TableHeaderMod,
          TableCellMod,
          TextAlignMod,
          ImageMod,
        ] = await Promise.all([
          importWithFallback("@tiptap/core@2"),
          importWithFallback("@tiptap/starter-kit@2"),
          importWithFallback("@tiptap/extension-underline@2"),
          importWithFallback("@tiptap/extension-highlight@2"),
          importWithFallback("@tiptap/extension-table@2"),
          importWithFallback("@tiptap/extension-table-row@2"),
          importWithFallback("@tiptap/extension-table-header@2"),
          importWithFallback("@tiptap/extension-table-cell@2"),
          importWithFallback("@tiptap/extension-text-align@2"),
          importWithFallback("@tiptap/extension-image@2"),
        ]);
        const StarterKit = StarterKitMod.default;
        const Underline = UnderlineMod.default;
        const Highlight = HighlightMod.default;
        const Table = TableMod.default;
        const TableRow = TableRowMod.default;
        const TableHeader = TableHeaderMod.default;
        const TableCell = TableCellMod.default;
        const TextAlign = TextAlignMod.default;
        const Image = ImageMod.default;
        // 🖼 ResizableImage:把 width 當 attribute,渲染成 style:width:XX% — 跟筆記本一樣
        const ResizableImage = Image.extend({
          addAttributes() {
            return {
              ...this.parent?.(),
              width: {
                default: null,
                parseHTML: (el) => {
                  const style = el.getAttribute("style") || "";
                  const m = style.match(/width\s*:\s*([^;]+)/);
                  if (m) return m[1].replace(/\s*!important\s*/g, "").trim();
                  return el.getAttribute("width") || null;
                },
                renderHTML: (attrs) =>
                  attrs.width
                    ? {
                        style: `width: ${attrs.width} !important; max-width: ${attrs.width} !important;`,
                      }
                    : {},
              },
            };
          },
        });
        _coreModules = {
          core,
          StarterKit,
          Underline,
          Highlight,
          Table,
          TableRow,
          TableHeader,
          TableCell,
          TextAlign,
          Image: ResizableImage,
        };
        return _coreModules;
      }

      // 🖼 設定/縮放圖片寬度(只對目前選取的圖片生效)
      function imgWidth(w) {
        if (!_editor || !canEditCurrent()) return;
        const sel = _editor.state.selection;
        if (!sel) return;
        const node = _editor.state.doc.nodeAt(sel.from);
        if (node && node.type.name === "image") {
          _editor
            .chain()
            .updateAttributes("image", { width: w })
            .setNodeSelection(sel.from)
            .focus()
            .run();
        } else {
          showToast("請先點圖片再按尺寸");
        }
      }
      function imgStep(delta) {
        if (!_editor || !canEditCurrent()) return;
        const sel = _editor.state.selection;
        if (!sel) return;
        const node = _editor.state.doc.nodeAt(sel.from);
        if (!node || node.type.name !== "image") {
          showToast("請先點圖片再按 +/−");
          return;
        }
        const cur = node.attrs.width || "60%";
        const m = String(cur).match(/^(\d+)(%|px)?$/);
        let n = m ? parseInt(m[1]) : 60;
        const unit = m && m[2] ? m[2] : "%";
        n = Math.max(10, Math.min(100, n + delta));
        _editor
          .chain()
          .updateAttributes("image", { width: n + unit })
          .setNodeSelection(sel.from)
          .focus()
          .run();
      }

      // 🖼 圖片上傳(v322:固定走 dental-mnemonics-shared,不讀使用者 settings 的 repo)
      //    這樣 HUA 跟 Shirley 兩個人圖片放同一個地方，兩人都看得到。
      //    使用者設定的 github_repo 只給筆記本貼圖用。
      // v336:圖片上傳目標改回讀使用者 settings 的 repo,每個人傳到自己有寫入權的 repo
      //       兩邊圖片放不同 repo,但 raw.github URL 是公開的，互看沒問題
      //       (HUA → Victor19940313/2nd-dental-exam · Shirley → Victor19940313/dental-mnemonics-shared)
      const IMAGE_DIR_NEW = "mnemonics-images";

      async function uploadImageToGithub(blob) {
        const token = getGithubToken();
        if (!token) throw new Error("沒設定 GitHub token");
        const repo = getGithubRepo(); // 讀使用者設定，沒設 / 格式錯會 fallback 到 REPO_DEFAULT
        // base64
        const b64 = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(String(r.result).split(",")[1]);
          r.onerror = () => reject(new Error("讀檔失敗"));
          r.readAsDataURL(blob);
        });
        const ts = new Date();
        const stamp =
          ts.getFullYear() +
          String(ts.getMonth() + 1).padStart(2, "0") +
          String(ts.getDate()).padStart(2, "0") +
          "-" +
          String(ts.getHours()).padStart(2, "0") +
          String(ts.getMinutes()).padStart(2, "0") +
          String(ts.getSeconds()).padStart(2, "0");
        const rand = Math.random().toString(36).slice(2, 6);
        const ext = ((blob.type || "image/png").split("/")[1] || "png").replace(
          "jpeg",
          "jpg",
        );
        const path = `${IMAGE_DIR_NEW}/${stamp}-${rand}.${ext}`;
        const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
        const res = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: `upload mnemonics image (${CUR_USER.name})`,
            content: b64,
          }),
        });
        if (!res.ok) {
          const errTxt = await res.text();
          if (res.status === 403 && /not accessible/i.test(errTxt)) {
            throw new Error(
              `你的 token 沒有「${repo}」的寫入權。去「考試 App → ⚙️ 設定 → GitHub」確認 repo 跟 token 是配對的`,
            );
          }
          if (res.status === 404) {
            throw new Error(
              `repo「${repo}」找不到。設定頁裡的 repo 名稱拼錯，或 token 沒給該 repo 的 Contents 權限`,
            );
          }
          throw new Error("GitHub " + res.status + ": " + errTxt.slice(0, 200));
        }
        // raw.github 用來顯示(任何人讀，不需 token)
        return `https://raw.githubusercontent.com/${repo}/main/${path}`;
      }

      async function tryUploadAndInsert(blob) {
        if (!canEditCurrent()) {
          showToast("你沒有編輯權限");
          return;
        }
        if (!_editor) return;
        // v322:沒 token 早期擋下，顯示具體解法
        if (!getGithubToken()) {
          showToast("🔒 還沒設 GitHub token,圖片功能停用。文字共筆照常用");
          alert(
            "要貼圖必須設 GitHub token:\n\n1. 去 https://github.com/settings/personal-access-tokens/new 生 token\n   - Repository access:選 Victor19940313/dental-mnemonics-shared\n   - Permissions:Contents → Read and write\n2. 複製 token,回到考試 App → ⚙️ 設定 → GitHub 貼上\n3. repo 填 Victor19940313/dental-mnemonics-shared\n\n(只想打字不貼圖的話，直接按取消就好)",
          );
          return;
        }
        showToast("📷 上傳中…(大圖會慢一點)");

      // 📷 工具列觸發檔案選擇
      function pickImageFile() {
        if (!canEditCurrent()) return;
        // 沒 token 就直接走 tryUploadAndInsert 的 alert 路徑，讓使用者知道為什麼不能貼
        if (!getGithubToken()) {
          tryUploadAndInsert(null);
          return;
        }
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = "image/*";
        inp.onchange = (e) => {
          const f = e.target.files[0];
          if (f) tryUploadAndInsert(f);
        };
        inp.click();
      }

      async function initEditorOnce() {
        if (_editor) return;
        const mods = await loadTipTapModules();
        const body = document.getElementById("editor-body");
        body.innerHTML = "";
        _editor = new mods.core.Editor({
          element: body,
          extensions: [
            mods.StarterKit,
            mods.Underline,
            mods.Highlight,
            mods.Table.configure({ resizable: true }),
            mods.TableRow,
            mods.TableHeader,
            mods.TableCell,
            mods.TextAlign.configure({ types: ["heading", "paragraph"] }),
            mods.Image.configure({ inline: true, allowBase64: false }),
          ],
          content: "<p></p>",
          editable: false, // 預設閱覽模式，按「✏ 編輯」才轉成 true
          editorProps: {
            handlePaste(view, event) {
              if (!canEditCurrent()) return false;
              const cd = event.clipboardData;
              if (!cd) return false;
              for (const item of cd.items || []) {
                if (item.type && item.type.startsWith("image/")) {
                  event.preventDefault();
                  const blob = item.getAsFile();
                  if (blob) tryUploadAndInsert(blob);
                  return true;
                }
              }
              return false;
            },
            handleDrop(view, event) {
              if (!canEditCurrent()) return false;
              const files = event.dataTransfer && event.dataTransfer.files;
              if (!files || !files.length) return false;
              for (const file of files) {
                if (file.type && file.type.startsWith("image/")) {
                  event.preventDefault();
                  tryUploadAndInsert(file);
                  return true;
                }
              }
              return false;
            },
          },
          onUpdate: () => {
            _dirty = true;
            refreshStatusUI();
          },
          onSelectionUpdate: ({ editor }) => {
            // 🖼 選到圖片才顯示圖片工具列
            const tbar = document.getElementById("img-toolbar");
            if (!tbar) return;
            const sel = editor.state.selection;
            const node = sel ? editor.state.doc.nodeAt(sel.from) : null;

              node &&
              node.type.name === "image" &&
              _editMode &&

            if (statusEl && isImg) {
              const w = node.attrs.width || "預設";
              statusEl.textContent = "目前寬度:" + w;
            }
          },
        });
      }

          TOOLS.forEach((t) => {

          // v574: 自己的口訣與重點分享區 = 自己的 namespace (HUA/Shirley 沿用舊名稱,其他人用 uid)

      // v532: 等 Firebase Auth 拿到使用者才 init
